worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/plain application/json text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    # HTTP → HTTPS 重定向（取消注释以启用）
    # server {
    #     listen 80;
    #     server_name your-domain.com;
    #     return 301 https://$host$request_uri;
    # }

    server {
        listen 80;
        # 上线后取消注释以下 SSL 配置，并注释掉 listen 80
        # listen 443 ssl;
        # ssl_certificate /etc/nginx/certs/fullchain.pem;
        # ssl_certificate_key /etc/nginx/certs/privkey.pem;
        # ssl_protocols TLSv1.2 TLSv1.3;
        server_name _;

        # 管理接口限制请求体大小 (图片上传)
        location /api/admin/ {
            client_max_body_size 10m;
            proxy_pass http://app:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 静态图片 - Nginx 直接返回，长缓存，允许跨域
        location /images/ {
            alias /usr/share/nginx/images/;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
            add_header X-Content-Type-Options nosniff;
            add_header Access-Control-Allow-Origin *;
            try_files $uri =404;
        }

        # Skill 文件下载 - Nginx 直接返回，允许跨域
        location /skills/ {
            alias /usr/share/nginx/skills/;
            add_header Content-Disposition "attachment";
            add_header Cache-Control "public, max-age=3600";
            add_header Access-Control-Allow-Origin *;
            try_files $uri =404;
        }

        # Next.js 静态资源 - 长缓存
        location /_next/static/ {
            proxy_pass http://app:3000;
            expires 365d;
            add_header Cache-Control "public, immutable";
        }

        # Next.js 应用 - 反向代理
        location / {
            proxy_pass http://app:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
